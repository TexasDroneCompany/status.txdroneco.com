# Texas Drone Company service status
# Powered by Upptime (https://upptime.js.org)
#
# Outside-in monitoring: these checks run from GitHub Actions, so they keep
# working (and keep alerting via GitHub Issues) even when our own stack is down.
# Complements the internal /admin/status page in the DroneVision app.

owner: TexasDroneCompany
repo: status.txdroneco.com

sites:
  # Customer-facing portal (Vercel). /login is a stable unauthenticated 200;
  # the root path 307-redirects, so we check the login page directly.
  - name: DroneVision Portal
    url: https://dronevision.txdroneco.com/login

  # Map tile service (txtiler-1 droplet, behind Caddy). Root returns 200.
  - name: Map Tiles (txTiler)
    url: https://txtiler.txdroneco.com

  # Photo packager on the same droplet, distinct container - its /health is
  # deliberately unauthenticated and reports queue state. A separate check
  # because the packager can be down while Caddy/txTiler are up.
  - name: Photo Packager
    url: https://txtiler.txdroneco.com/packager/health

  # Selfhosted ODM pipeline runner (odm-1 droplet). Open /health route.
  - name: ODM Processing
    url: https://odm.txdroneco.com/health

  # Supabase API gateway (auth + DB + storage front door). The health route
  # returns 401 without an apikey header - that still proves the gateway is
  # up and responding, without baking a key into a public repo.
  - name: Supabase API
    url: https://uhlfqorijoabyzjhhsdo.supabase.co/auth/v1/health
    expectedStatusCodes:
      - 200
      - 401

status-website:
  # Requires the Cloudflare CNAME: status -> texasdronecompany.github.io
  # (bare hostname, no path; DNS-only/gray cloud so the page outlives a CF outage)
  cname: status.txdroneco.com
  name: Texas Drone Company
  # txDroneCo wordmark. The repo copy has viewBox cropped to the artwork
  # (source canvas is mostly empty margin) and txBlack baked into fill -
  # an <img>-loaded SVG can't inherit currentColor from the page.
  logoUrl: https://raw.githubusercontent.com/TexasDroneCompany/status.txdroneco.com/master/assets/txdroneco-logo.svg
  introTitle: "**Texas Drone Company** service status"
  introMessage: Live uptime and response times for the DroneVision portal and processing pipeline. Having trouble? Reach us at [txdroneco.com](https://txdroneco.com).
  # Brand fonts: Bebas Neue (headlines), Roboto (body), Roboto Mono (technical)
  customHeadHtml: '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet">'
  # txDroneCo brand overrides, verified against the live DOM 2026-09-05.
  # Element-level selectors only - the site's Svelte class hashes change on
  # rebuilds. Palette: txBlack #231f20, txBlue #0075b2, txGreen #95c93d,
  # txYellow #fbac1b, txRed #ef4136. Response-time graphs are PNGs baked by
  # Graphs CI, so their mint fill is not CSS-reachable.
  css: |
    body { background: #f5f5f4 !important; color: #231f20 !important; font-family: 'Roboto', -apple-system, sans-serif !important; }
    h1, h2, h3 { font-family: 'Bebas Neue', 'Roboto', sans-serif !important; font-weight: 400 !important; letter-spacing: 0.04em; text-transform: uppercase; color: #231f20 !important; }
    h1 { font-size: 2.8rem !important; }
    nav { background: #ffffff !important; border-bottom: 3px solid #0075b2; }
    nav a { color: #231f20 !important; border-bottom-color: #0075b2 !important; }
    nav a:hover { color: #0075b2 !important; }
    nav img { height: 1.75rem !important; width: auto !important; }
    main a, .lead a, footer a { color: #0075b2 !important; }
    article.up { border-left: 4px solid #95c93d !important; }
    article.degraded { border-left: 4px solid #fbac1b !important; }
    article.down { border-left: 4px solid #ef4136 !important; }
  navbar:
    - title: Status
      href: /
    - title: DroneVision Portal
      href: https://dronevision.txdroneco.com
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Downtime opens a GitHub Issue in this repo and assigns it - that's the
# built-in alerting. Slack/email notifications can be added later via secrets.
assignees:
  - txdroneco
